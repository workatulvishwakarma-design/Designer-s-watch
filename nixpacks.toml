[phases.setup]
nixPkgs = ["nodejs_22", "npm-9_x"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = [
  "npx prisma generate",
  "npm run build",
  "mkdir -p .next/standalone/public && cp -r public/* .next/standalone/public/ || true",
  "mkdir -p .next/standalone/.next/static && cp -r .next/static/* .next/standalone/.next/static/ || true"
]

[start]
cmd = "npx prisma db push --accept-data-loss && (node .next/standalone/server.js || node .next/standalone/app/server.js || node .next/standalone/OneDrive/Desktop/resources/watch-2/server.js || npm run start)"
